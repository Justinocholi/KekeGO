# ==============================================================================
# KEKEGO — Production Nginx Reverse Proxy & TLS Configuration
# Subdomains:
#   - api.kekego.ng     -> Kekego Fastify API + Socket.io (port 4000)
#   - admin.kekego.ng   -> Kekego Next.js Admin Dashboard (port 3000)
# ==============================================================================

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=5r/s;

# Upstream Definitions
upstream kekego_api_upstream {
    server api:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream kekego_admin_upstream {
    server admin:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS Global Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.kekego.ng admin.kekego.ng kekego.ng www.kekego.ng;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. API Backend & WebSocket Server (api.kekego.ng)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.kekego.ng;

    # TLS Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/api.kekego.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kekego.ng/privkey.pem;

    # TLS Protocols & Cipher Suites
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum payload size (for driver document & vehicle photo uploads: 10MB)
    client_max_body_size 10M;

    # Root proxy pass to Fastify
    location / {
        limit_req zone=api_general_limit burst=50 nodelay;

        proxy_pass http://kekego_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Strict rate limiting for OTP verification & authentication endpoints
    location /auth/ {
        limit_req zone=api_auth_limit burst=10 nodelay;

        proxy_pass http://kekego_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Real-Time WebSocket Channel (Socket.io)
    location /socket.io/ {
        proxy_pass http://kekego_api_upstream;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for persistent driver/passenger telemetry
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health Check endpoints (bypasses rate limit)
    location ~ ^/(health|ready)$ {
        proxy_pass http://kekego_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

# ------------------------------------------------------------------------------
# 3. Operations & Admin Dashboard (admin.kekego.ng)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.kekego.ng;

    # TLS Certificates
    ssl_certificate /etc/letsencrypt/live/admin.kekego.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.kekego.ng/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js Static Cache Optimization
    location /_next/static/ {
        proxy_pass http://kekego_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Admin App Proxy
    location / {
        proxy_pass http://kekego_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
